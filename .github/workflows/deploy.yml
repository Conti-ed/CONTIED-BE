name: Deploy to GCP

on:
  push:
    branches: [ "m" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v3

    - name: 도커 허브 로그인
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 도커 빌드 및 푸시
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/contied-be:latest

    - name: GCP 서버 접속 및 컨테이너 실행
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/contied-be:latest
          docker stop contied-server || true
          docker rm contied-server || true
          docker run -d -p 80:8080 --name contied-server --env-file ~/.env ${{ secrets.DOCKER_USERNAME }}/contied-be:latest
          docker image prune -f