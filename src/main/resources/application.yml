spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.xxxxxxxxxxxx.supabase.co:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  jwt:
    public_key: "${SUPABASE_JWT_PUBLIC_KEY}"
